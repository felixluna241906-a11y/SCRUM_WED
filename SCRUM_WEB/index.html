<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCRUM PLANING — Iniciar Sesión</title>
    <link
      rel="icon"
      type="image/svg+xml"

    />
  </head>
  <body class="antialiased text-slate-800 bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Respaldo automático cuando index.html se abre directamente sin servidor Vite -->
    <script>
      (function () {
        function initDirectBrowserFallback() {
          var root = document.getElementById('root');
          if (!root || root.getAttribute('data-vite-mounted') === 'true') {
            return;
          }

          if (!document.getElementById('sp-fallback-css')) {
            var style = document.createElement('style');
            style.id = 'sp-fallback-css';
            style.textContent = [
              '*,*::before,*::after{box-sizing:border-box}',
              'html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1e293b;background:#f8fafc;-webkit-font-smoothing:antialiased}',
              '.sp-page{position:relative;min-height:100vh;overflow:hidden;background:linear-gradient(135deg,#f8fafc 0%,rgba(240,249,255,.9) 50%,rgba(238,242,255,.95) 100%);display:flex;align-items:center;justify-content:center;padding:40px 16px}',
              '.sp-blob{position:absolute;border-radius:9999px;pointer-events:none;filter:blur(64px)}',
              '.sp-blob-1{width:384px;height:384px;left:-96px;top:-96px;background:rgba(186,230,253,.45)}',
              '.sp-blob-2{width:448px;height:448px;right:-80px;bottom:-112px;background:rgba(199,210,254,.45)}',
              '.sp-blob-3{width:288px;height:288px;left:50%;top:33%;transform:translateX(-50%);background:rgba(204,251,241,.5)}',
              '.sp-main{position:relative;z-index:10;width:100%;max-width:1024px;margin:0 auto}',
              '.sp-grid{display:grid;grid-template-columns:1fr;gap:32px;align-items:center}',
              '@media(min-width:1024px){.sp-grid{grid-template-columns:1fr 1fr;gap:48px}.sp-mobile-logo{display:none}.sp-desktop-hero{display:block}}',
              '@media(max-width:1023px){.sp-desktop-hero{display:none}.sp-mobile-logo{display:flex;justify-content:center;margin-bottom:8px}}',
              '.sp-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:9999px;border:1px solid rgba(186,230,253,.8);background:rgba(255,255,255,.82);font-size:12px;font-weight:600;color:#0369a1;box-shadow:0 1px 2px rgba(15,23,42,.04)}',
              '.sp-dot{width:8px;height:8px;border-radius:9999px;background:#0ea5e9}',
              '.sp-brand{display:flex;align-items:center;gap:14px}',
              '.sp-logo-box{width:48px;height:48px;border-radius:16px;padding:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#38bdf8,#6366f1,#8b5cf6);box-shadow:0 10px 20px -5px rgba(99,102,241,.35);flex-shrink:0}',
              '.sp-brand-title{font-size:24px;font-weight:800;letter-spacing:-0.025em;color:#1e293b;line-height:1.1}',
              '.sp-brand-accent{background:linear-gradient(90deg,#0ea5e9,#4f46e5);-webkit-background-clip:text;background-clip:text;color:transparent}',
              '.sp-brand-sub{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#94a3b8;margin-top:2px}',
              '.sp-slogan{font-size:36px;font-weight:800;line-height:1.15;letter-spacing:-0.025em;color:#1e293b;margin:24px 0 0}',
              '.sp-subtitle{font-size:16px;line-height:1.6;color:#475569;margin:12px 0 0;max-width:440px}',
              '.sp-highlights{margin-top:32px;display:flex;flex-direction:column;gap:12px}',
              '.sp-highlight{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.68);backdrop-filter:blur(12px);box-shadow:0 1px 3px rgba(15,23,42,.04)}',
              '.sp-check-badge{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,#e0f2fe,#e0e7ff);color:#4f46e5;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}',
              '.sp-card{width:100%;max-width:448px;margin:0 auto;border-radius:24px;border:1px solid rgba(255,255,255,.92);background:rgba(255,255,255,.88);backdrop-filter:blur(20px);padding:32px;box-shadow:0 20px 35px -10px rgba(99,102,241,.14),0 4px 12px rgba(15,23,42,.04)}',
              '.sp-card-title{font-size:24px;font-weight:700;color:#1e293b;margin:0}',
              '.sp-card-desc{font-size:14px;color:#64748b;margin:6px 0 24px}',
              '.sp-field{margin-bottom:20px}',
              '.sp-label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}',
              '.sp-label{font-size:14px;font-weight:500;color:#334155}',
              '.sp-type-badge{font-size:11px;font-weight:500;color:#0369a1;background:#f0f9ff;border:1px solid #bae6fd;padding:2px 10px;border-radius:9999px}',
              '.sp-input-wrap{position:relative}',
              '.sp-input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;display:flex;pointer-events:none}',
              '.sp-input{width:100%;border-radius:12px;border:1px solid #e2e8f0;background:rgba(248,250,252,.75);padding:11px 42px 11px 44px;font-size:14px;color:#1e293b;outline:none;transition:all .15s}',
              '.sp-input:focus{background:#fff;border-color:#38bdf8;box-shadow:0 0 0 4px rgba(186,230,253,.45)}',
              '.sp-input.is-error{border-color:#fda4af}',
              '.sp-input.is-error:focus{border-color:#fb7185;box-shadow:0 0 0 4px rgba(254,205,211,.5)}',
              '.sp-eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;padding:4px;display:flex}',
              '.sp-eye-btn:hover{color:#475569}',
              '.sp-error-msg{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:12px;font-weight:500;color:#e11d48}',
              '.sp-reqs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}',
              '.sp-req{display:flex;align-items:center;gap:6px;font-size:11px;color:#94a3b8;transition:color .15s}',
              '.sp-req.met{color:#059669;font-weight:500}',
              '.sp-req-dot{width:14px;height:14px;border-radius:9999px;background:#f1f5f9;color:#94a3b8;display:flex;align-items:center;justify-content:center}',
              '.sp-req.met .sp-req-dot{background:#d1fae5;color:#059669}',
              '.sp-row-between{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:8px}',
              '.sp-checkbox-label{display:flex;align-items:center;gap:8px;font-size:12px;color:#475569;cursor:pointer;user-select:none}',
              '.sp-link-btn{background:none;border:none;padding:0;font-size:12px;font-weight:600;color:#4f46e5;cursor:pointer}',
              '.sp-link-btn:hover{color:#4338ca}',
              '.sp-demo-btn{background:none;border:none;padding:0;font-size:12px;font-weight:500;color:#64748b;text-decoration:underline;text-underline-offset:2px;cursor:pointer}',
              '.sp-demo-btn:hover{color:#0284c7}',
              '.sp-submit{width:100%;border:none;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(90deg,#0ea5e9,#6366f1,#4f46e5);box-shadow:0 8px 18px -4px rgba(99,102,241,.45);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}',
              '.sp-submit:hover{filter:brightness(1.03);transform:translateY(-1px)}',
              '.sp-submit:disabled{opacity:.7;cursor:not-allowed;transform:none}',
              '.sp-footer-note{margin-top:24px;padding-top:20px;border-top:1px solid #f1f5f9;text-align:center;font-size:12px;color:#64748b}',
              '.sp-toasts{position:fixed;top:16px;right:16px;z-index:50;display:flex;flex-direction:column;gap:12px;width:calc(100% - 32px);max-width:380px;pointer-events:none}',
              '.sp-toast{pointer-events:auto;border-radius:16px;border:1px solid #e2e8f0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);box-shadow:0 12px 28px -6px rgba(15,23,42,.12);overflow:hidden;animation:spToastIn .22s ease-out}',
              '.sp-toast-body{display:flex;align-items:flex-start;gap:12px;padding:14px 16px}',
              '.sp-toast-icon{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}',
              '.sp-toast-title{font-size:14px;font-weight:600;color:#1e293b;margin:0}',
              '.sp-toast-desc{font-size:12px;color:#475569;margin:2px 0 0;line-height:1.45}',
              '.sp-toast-close{background:none;border:none;color:#94a3b8;cursor:pointer;padding:4px;border-radius:8px}',
              '.sp-toast-close:hover{background:#f1f5f9;color:#475569}',
              '.sp-toast-bar{height:4px;width:100%;background:#f1f5f9}',
              '.sp-toast-progress{height:100%;animation:spShrink linear forwards}',
              '.sp-dash-card{max-width:512px;text-align:center}',
              '.sp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}',
              '.sp-stat{border-radius:16px;border:1px solid #f1f5f9;background:linear-gradient(180deg,#fff,rgba(248,250,252,.85));padding:12px}',
              '.sp-stat-val{font-size:20px;font-weight:700;color:#1e293b;margin:0}',
              '.sp-btn-row{display:flex;gap:10px;margin-top:24px}',
              '.sp-btn-sec{flex:1;border-radius:12px;border:1px solid #e2e8f0;background:#fff;padding:10px 16px;font-size:14px;font-weight:500;color:#334155;cursor:pointer}',
              '.sp-btn-sec:hover{background:#f8fafc}',
              '@keyframes spToastIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}',
              '@keyframes spShrink{from{width:100%}to{width:0%}}'
            ].join('');
            document.head.appendChild(style);
          }

          var EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
          var USER_REGEX = /^[a-zA-Z0-9._-]+$/;
          var REMEMBER_KEY = 'scrum_planing_remembered_user';
          var BRAND_SLOGAN = 'Planifica tus sprints con claridad, impulsa cada entrega.';

          var state = {
            identifier: (function () {
              try { return localStorage.getItem(REMEMBER_KEY) || ''; } catch (e) { return ''; }
            })(),
            password: '',
            rememberMe: true,
            showPassword: false,
            touched: { identifier: false, password: false },
            isSubmitting: false,
            user: null
          };

          var toastContainer = document.createElement('div');
          toastContainer.className = 'sp-toasts';
          document.body.appendChild(toastContainer);

          function showToast(opts) {
            var variant = opts.variant || 'info';
            var duration = opts.duration !== undefined ? opts.duration : 4000;
            var palette = {
              success: { border: '#a7f3d0', bg: '#ecfdf5', color: '#059669', bar: '#10b981' },
              error: { border: '#fecdd3', bg: '#fff1f2', color: '#e11d48', bar: '#f43f5e' },
              warning: { border: '#fde68a', bg: '#fffbeb', color: '#d97706', bar: '#f59e0b' },
              info: { border: '#bae6fd', bg: '#f0f9ff', color: '#0284c7', bar: '#0ea5e9' }
            }[variant];

            var icons = {
              success: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>',
              error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/></svg>',
              warning: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>',
              info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 16v-4m0-4h.01"/></svg>'
            };

            var toast = document.createElement('div');
            toast.className = 'sp-toast';
            toast.style.borderColor = palette.border;
            toast.setAttribute('role', 'status');
            toast.innerHTML =
              '<div class="sp-toast-body">' +
                '<div class="sp-toast-icon" style="background:' + palette.bg + ';color:' + palette.color + '">' + icons[variant] + '</div>' +
                '<div style="flex:1;min-width:0">' +
                  '<p class="sp-toast-title"></p>' +
                  (opts.description ? '<p class="sp-toast-desc"></p>' : '') +
                '</div>' +
                '<button type="button" class="sp-toast-close" aria-label="Cerrar">&#10005;</button>' +
              '</div>' +
              '<div class="sp-toast-bar"><div class="sp-toast-progress" style="background:' + palette.bar + ';animation-duration:' + duration + 'ms"></div></div>';

            toast.querySelector('.sp-toast-title').textContent = opts.title;
            if (opts.description) {
              toast.querySelector('.sp-toast-desc').textContent = opts.description;
            }
            var timer = setTimeout(function () { toast.remove(); }, duration);
            toast.querySelector('.sp-toast-close').addEventListener('click', function () {
              clearTimeout(timer);
              toast.remove();
            });
            toastContainer.appendChild(toast);
          }

          function escapeHtml(str) {
            return String(str)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;');
          }

          function validateIdentifier(raw) {
            var val = raw.trim();
            if (!val) return 'Ingresa tu correo electrónico o nombre de usuario.';
            if (val.indexOf('@') !== -1) {
              if (!EMAIL_REGEX.test(val)) return 'El formato del correo electrónico no es válido (ej. nombre@empresa.com).';
              return '';
            }
            if (/\s/.test(val)) return 'El nombre de usuario no puede contener espacios.';
            if (val.length < 3) return 'El usuario debe tener al menos 3 caracteres.';
            if (val.length > 30) return 'El usuario no puede superar los 30 caracteres.';
            if (!USER_REGEX.test(val)) return 'El usuario solo puede incluir letras, números, ".", "_" o "-".';
            return '';
          }

          function validatePassword(val) {
            if (!val) return 'Ingresa tu contraseña.';
            if (val.length < 8) return 'La contraseña debe tener al menos 8 caracteres.';
            if (!/[A-Z]/.test(val)) return 'Incluye al menos una letra mayúscula.';
            if (!/[a-z]/.test(val)) return 'Incluye al menos una letra minúscula.';
            if (!/\d/.test(val)) return 'Incluye al menos un número.';
            return '';
          }

          function logoHtml(center) {
            return (
              '<div class="sp-brand" style="' + (center ? 'justify-content:center;' : '') + '">' +
                '<div class="sp-logo-box">' +
                  '<svg viewBox="0 0 36 36" fill="none" width="28" height="28">' +
                    '<rect x="4" y="6" width="7.5" height="15" rx="2.2" fill="white" fill-opacity="0.95"/>' +
                    '<rect x="14.25" y="6" width="7.5" height="10.5" rx="2.2" fill="white" fill-opacity="0.75"/>' +
                    '<rect x="24.5" y="6" width="7.5" height="7" rx="2.2" fill="white" fill-opacity="0.55"/>' +
                    '<path d="M6 27.5C11.5 27.5 14 23 20.5 23H29.5" stroke="white" stroke-width="2.8" stroke-linecap="round"/>' +
                    '<path d="M26 19.5L30.5 23L26 26.5" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>' +
                  '</svg>' +
                '</div>' +
                '<div style="text-align:left">' +
                  '<div class="sp-brand-title">SCRUM <span class="sp-brand-accent">PLANING</span></div>' +
                  '<div class="sp-brand-sub">Agile &amp; Sprint Hub</div>' +
                '</div>' +
              '</div>'
            );
          }

          function render() {
            if (state.user) {
              root.innerHTML =
                '<div class="sp-page">' +
                  '<div class="sp-blob sp-blob-1"></div><div class="sp-blob sp-blob-2"></div><div class="sp-blob sp-blob-3"></div>' +
                  '<main class="sp-main">' +
                    '<section class="sp-card sp-dash-card">' +
                      logoHtml(true) +
                      '<div style="margin-top:22px"><span class="sp-pill" style="background:#ecfdf5;border-color:#a7f3d0;color:#047857"><span class="sp-dot" style="background:#10b981"></span>Sesión activa (' + state.user.loginType + ')</span></div>' +
                      '<h1 style="margin:16px 0 6px;font-size:24px;font-weight:700">¡Bienvenido, ' + escapeHtml(state.user.displayName) + '!</h1>' +
                      '<p style="margin:0;font-size:14px;color:#475569">Accediste a <strong>SCRUM PLANING</strong> con <span style="color:#4f46e5;font-weight:600">' + escapeHtml(state.user.identifier) + '</span>.</p>' +
                      '<div class="sp-stats">' +
                        '<div class="sp-stat"><p class="sp-stat-val">6</p><span class="sp-type-badge">Por hacer</span></div>' +
                        '<div class="sp-stat"><p class="sp-stat-val">4</p><span class="sp-type-badge" style="background:#eef2ff;border-color:#c7d2fe;color:#4338ca">En curso</span></div>' +
                        '<div class="sp-stat"><p class="sp-stat-val">9</p><span class="sp-type-badge" style="background:#ecfdf5;border-color:#a7f3d0;color:#047857">Completadas</span></div>' +
                      '</div>' +
                      '<div style="margin-top:20px;padding:16px;border-radius:16px;border:1px solid #f1f5f9;background:linear-gradient(135deg,#f8fafc,#f0f9ff);text-align:left">' +
                        '<div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#94a3b8">SCRUM PLANING</div>' +
                        '<div style="font-size:14px;font-weight:500;color:#334155;margin-top:4px">' + BRAND_SLOGAN + '</div>' +
                      '</div>' +
                      '<div class="sp-btn-row">' +
                        '<button type="button" id="sp-test-toast" class="sp-btn-sec">Probar Toast</button>' +
                        '<button type="button" id="sp-logout" class="sp-submit" style="flex:1">Cerrar sesión</button>' +
                      '</div>' +
                    '</section>' +
                  '</main>' +
                '</div>';

              document.getElementById('sp-test-toast').addEventListener('click', function () {
                showToast({ variant: 'success', title: 'Tablero sincronizado', description: 'Las historias del Sprint actual están actualizadas.' });
              });
              document.getElementById('sp-logout').addEventListener('click', function () {
                state.user = null;
                state.password = '';
                state.touched = { identifier: false, password: false };
                showToast({ variant: 'info', title: 'Sesión cerrada', description: 'Has salido de SCRUM PLANING de forma segura.' });
                render();
              });
              return;
            }

            root.innerHTML =
              '<div class="sp-page">' +
                '<div class="sp-blob sp-blob-1"></div><div class="sp-blob sp-blob-2"></div><div class="sp-blob sp-blob-3"></div>' +
                '<main class="sp-main">' +
                  '<div class="sp-grid">' +
                    '<section>' +
                      '<div class="sp-mobile-logo"><div>' + logoHtml(true) + '<p style="text-align:center;font-size:14px;color:#475569;margin:10px auto 0;max-width:300px">' + BRAND_SLOGAN + '</p></div></div>' +
                      '<div class="sp-desktop-hero">' +
                        '<span class="sp-pill"><span class="sp-dot"></span>Plataforma ágil de planificación Scrum</span>' +
                        '<div style="margin-top:24px">' + logoHtml(false) + '</div>' +
                        '<h1 class="sp-slogan">' + BRAND_SLOGAN + '</h1>' +
                        '<p class="sp-subtitle">Organiza tu backlog, estima historias de usuario y coordina a tu equipo en un entorno ligero y moderno.</p>' +
                        '<div class="sp-highlights">' +
                          '<div class="sp-highlight"><span class="sp-check-badge">&#10003;</span><div><div style="font-size:14px;font-weight:600">Backlog priorizado</div><div style="font-size:12px;color:#475569">Ordena historias de usuario y criterios de aceptación sin fricción.</div></div></div>' +
                          '<div class="sp-highlight"><span class="sp-check-badge">&#10003;</span><div><div style="font-size:14px;font-weight:600">Planning Poker y Sprints</div><div style="font-size:12px;color:#475569">Estima esfuerzos en equipo y define metas claras por iteración.</div></div></div>' +
                          '<div class="sp-highlight"><span class="sp-check-badge">&#10003;</span><div><div style="font-size:14px;font-weight:600">Seguimiento diario</div><div style="font-size:12px;color:#475569">Visualiza bloqueos, avances y velocidad del equipo en tiempo real.</div></div></div>' +
                        '</div>' +
                      '</div>' +
                    '</section>' +
                    '<section>' +
                      '<div class="sp-card">' +
                        '<h2 class="sp-card-title">Iniciar sesión</h2>' +
                        '<p class="sp-card-desc">Accede a <strong>SCRUM PLANING</strong> con tu correo o nombre de usuario.</p>' +
                        '<form id="sp-form" novalidate>' +
                          '<div class="sp-field">' +
                            '<div class="sp-label-row"><label class="sp-label" for="sp-id">Correo electrónico o usuario</label><span id="sp-type-badge" class="sp-type-badge" style="display:none"></span></div>' +
                            '<div class="sp-input-wrap">' +
                              '<span class="sp-input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></span>' +
                              '<input id="sp-id" class="sp-input" type="text" placeholder="tu@correo.com o nombre.usuario" autocomplete="username" />' +
                            '</div>' +
                            '<p id="sp-id-err" class="sp-error-msg" style="display:none"></p>' +
                          '</div>' +
                          '<div class="sp-field">' +
                            '<div class="sp-label-row"><label class="sp-label" for="sp-pass">Contraseña</label><button type="button" id="sp-forgot" class="sp-link-btn">¿Olvidaste tu contraseña?</button></div>' +
                            '<div class="sp-input-wrap">' +
                              '<span class="sp-input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path stroke-linecap="round" d="M8 11V7a4 4 0 118 0v4"/></svg></span>' +
                              '<input id="sp-pass" class="sp-input" type="password" placeholder="••••••••" autocomplete="current-password" />' +
                              '<button type="button" id="sp-toggle-pass" class="sp-eye-btn" aria-label="Mostrar contraseña"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12C3.7 7.9 7.5 5 12 5s8.3 2.9 9.5 7c-1.2 4.1-5 7-9.5 7s-8.3-2.9-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg></button>' +
                            '</div>' +
                            '<p id="sp-pass-err" class="sp-error-msg" style="display:none"></p>' +
                            '<div class="sp-reqs">' +
                              '<div class="sp-req" id="req-len"><span class="sp-req-dot">&#10003;</span>Mínimo 8 caracteres</div>' +
                              '<div class="sp-req" id="req-up"><span class="sp-req-dot">&#10003;</span>Una mayúscula</div>' +
                              '<div class="sp-req" id="req-low"><span class="sp-req-dot">&#10003;</span>Una minúscula</div>' +
                              '<div class="sp-req" id="req-num"><span class="sp-req-dot">&#10003;</span>Un número</div>' +
                            '</div>' +
                          '</div>' +
                          '<div class="sp-row-between">' +
                            '<label class="sp-checkbox-label"><input type="checkbox" id="sp-remember" />Mantener mi sesión iniciada</label>' +
                            '<button type="button" id="sp-demo" class="sp-demo-btn">Probar ejemplo</button>' +
                          '</div>' +
                          '<button type="submit" id="sp-submit" class="sp-submit">Iniciar sesión</button>' +
                        '</form>' +
                        '<div class="sp-footer-note">¿Tu equipo aún no tiene cuenta? <button type="button" id="sp-req-access" class="sp-link-btn">Solicitar acceso</button></div>' +
                      '</div>' +
                    '</section>' +
                  '</div>' +
                '</main>' +
              '</div>';

            var idInput = document.getElementById('sp-id');
            var passInput = document.getElementById('sp-pass');
            var rememberInput = document.getElementById('sp-remember');
            var typeBadge = document.getElementById('sp-type-badge');
            var idErr = document.getElementById('sp-id-err');
            var passErr = document.getElementById('sp-pass-err');
            var submitBtn = document.getElementById('sp-submit');

            idInput.value = state.identifier;
            passInput.value = state.password;
            rememberInput.checked = state.rememberMe;

            function syncUI() {
              var trimmed = state.identifier.trim();
              if (trimmed) {
                typeBadge.style.display = 'inline-block';
                typeBadge.textContent = trimmed.indexOf('@') !== -1 ? 'Correo' : 'Usuario';
              } else {
                typeBadge.style.display = 'none';
              }

              var e1 = state.touched.identifier ? validateIdentifier(state.identifier) : '';
              idErr.textContent = e1;
              idErr.style.display = e1 ? 'flex' : 'none';
              idInput.classList.toggle('is-error', Boolean(e1));

              var e2 = state.touched.password ? validatePassword(state.password) : '';
              passErr.textContent = e2;
              passErr.style.display = e2 ? 'flex' : 'none';
              passInput.classList.toggle('is-error', Boolean(e2));

              document.getElementById('req-len').classList.toggle('met', state.password.length >= 8);
              document.getElementById('req-up').classList.toggle('met', /[A-Z]/.test(state.password));
              document.getElementById('req-low').classList.toggle('met', /[a-z]/.test(state.password));
              document.getElementById('req-num').classList.toggle('met', /\d/.test(state.password));
            }

            syncUI();

            idInput.addEventListener('input', function (e) {
              state.identifier = e.target.value;
              syncUI();
            });
            idInput.addEventListener('blur', function () {
              state.touched.identifier = true;
              syncUI();
            });
            passInput.addEventListener('input', function (e) {
              state.password = e.target.value;
              syncUI();
            });
            passInput.addEventListener('blur', function () {
              state.touched.password = true;
              syncUI();
            });
            rememberInput.addEventListener('change', function (e) {
              state.rememberMe = e.target.checked;
            });

            var togglePassBtn = document.getElementById('sp-toggle-pass');
            togglePassBtn.addEventListener('click', function () {
              state.showPassword = !state.showPassword;
              passInput.type = state.showPassword ? 'text' : 'password';
              togglePassBtn.setAttribute('aria-label', state.showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
              togglePassBtn.innerHTML = state.showPassword
                ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.58 10.58a2 2 0 002.83 2.83M9.88 4.24A9.77 9.77 0 0112 4c5.52 0 9.5 4.5 10 8-.23 1.62-1.15 3.49-2.66 4.98M6.61 6.61C4.62 8.05 3.3 10.02 3 12c.5 3.5 4.48 8 10 8 1.46 0 2.84-.31 4.07-.86"/></svg>'
                : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12C3.7 7.9 7.5 5 12 5s8.3 2.9 9.5 7c-1.2 4.1-5 7-9.5 7s-8.3-2.9-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg>';
            });

            document.getElementById('sp-demo').addEventListener('click', function () {
              state.identifier = 'scrum.master@scrumplaning.com';
              state.password = 'Sprint2026!';
              state.touched = { identifier: true, password: true };
              idInput.value = state.identifier;
              passInput.value = state.password;
              syncUI();
              showToast({ variant: 'info', title: 'Datos de ejemplo cargados', description: 'Pulsa "Iniciar sesión" para acceder a SCRUM PLANING.' });
            });

            document.getElementById('sp-forgot').addEventListener('click', function () {
              var trimmed = state.identifier.trim();
              if (trimmed && !validateIdentifier(trimmed)) {
                showToast({ variant: 'info', title: 'Recuperación de contraseña', description: 'Si ' + trimmed + ' está registrado en SCRUM PLANING, enviaremos instrucciones a tu correo.' });
              } else {
                showToast({ variant: 'warning', title: 'Ingresa tu correo o usuario primero', description: 'Escribe un correo o usuario válido para enviarte el enlace de recuperación.' });
              }
            });

            document.getElementById('sp-req-access').addEventListener('click', function () {
              showToast({ variant: 'info', title: 'Solicitud de cuenta', description: 'Contacta al Scrum Master de tu equipo para unirte a SCRUM PLANING.' });
            });

            document.getElementById('sp-form').addEventListener('submit', function (e) {
              e.preventDefault();
              if (state.isSubmitting) return;

              state.touched = { identifier: true, password: true };
              syncUI();

              var errId = validateIdentifier(state.identifier);
              var errPass = validatePassword(state.password);
              if (errId || errPass) {
                showToast({ variant: 'error', title: 'Datos de acceso inválidos', description: errId || errPass });
                return;
              }

              state.isSubmitting = true;
              submitBtn.disabled = true;
              submitBtn.textContent = 'Validando acceso...';

              setTimeout(function () {
                var cleanId = state.identifier.trim();
                var loginType = cleanId.indexOf('@') !== -1 ? 'correo' : 'usuario';
                var displayName = loginType === 'correo' ? cleanId.split('@')[0] : cleanId;
                try {
                  if (state.rememberMe) localStorage.setItem(REMEMBER_KEY, cleanId);
                  else localStorage.removeItem(REMEMBER_KEY);
                } catch (err) {}

                state.isSubmitting = false;
                state.user = { identifier: cleanId, displayName: displayName, loginType: loginType };
                showToast({ variant: 'success', title: '¡Sesión iniciada en SCRUM PLANING!', description: 'Bienvenido de nuevo, ' + displayName + '.' });
                render();
              }, 600);
            });
          }

          render();
        }

        if (window.location.protocol === 'file:') {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initDirectBrowserFallback);
          } else {
            initDirectBrowserFallback();
          }
        } else {
          window.addEventListener('load', initDirectBrowserFallback);
        }
      })();
    </script>
  </body>
</html>
